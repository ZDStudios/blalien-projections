<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Blalien Projections</title>
  <meta name="description" content="Browser projection mapping: warp visuals, photos and videos onto any surface.">
  <meta name="theme-color" content="#08080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blalien">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <button class="icon-btn mobile-only" data-act="toggle-left" title="Surfaces & media">☰</button>
      <div class="brand"><span class="logo"></span><span><b>Blalien</b> Projections</span></div>
      <div class="seg tools">
        <button data-tool="select" class="active" title="Map: select, warp & move (V)">Map</button>
        <button data-tool="draw" title="Draw on the selected surface (D)">Draw</button>
        <button data-tool="mask" title="Trace a custom outline (M)">Outline</button>
      </div>
      <div class="seg hide-sm">
        <button data-act="undo" title="Undo (Ctrl+Z)">↶</button>
        <button data-act="redo" title="Redo (Ctrl+Y)">↷</button>
      </div>
      <button class="btn danger" id="delBtn" data-act="delete" title="Delete the selected surface (Delete key)" hidden>🗑 Delete</button>
      <div class="spacer"></div>
      <span id="conn" class="badge hide-sm">…</span>
      <button class="btn hide-sm" data-act="share" title="Open on phones and other screens">Connect</button>
      <button class="btn accent" data-act="output" title="Open the projector output window">Output ↗</button>
      <button class="btn hide-sm" data-act="present" title="Present on this screen (H)">Present</button>
      <div class="menu-wrap">
        <button class="icon-btn" data-act="menu" title="Menu">⋯</button>
        <div id="menu" class="popover" hidden>
          <button data-act="share" class="show-sm">Connect devices</button>
          <button data-act="present" class="show-sm">Present here</button>
          <button data-act="settings">Settings</button>
          <button data-act="fullscreen">Fullscreen</button>
          <button data-act="midi">Enable MIDI</button>
          <hr>
          <button data-act="export">Save show (.json)</button>
          <button data-act="import">Open show…</button>
          <button data-act="demo">Load demo</button>
          <button data-act="new">New empty show</button>
          <hr>
          <button data-act="help">Help & shortcuts</button>
        </div>
      </div>
      <button class="icon-btn mobile-only" data-act="toggle-right" title="Inspector">⚙</button>
    </header>

    <aside id="left" class="panel">
      <section>
        <h3>Add surface</h3>
        <div id="shapeGrid" class="shape-grid"></div>
      </section>
      <section class="grow">
        <h3>Surfaces <span id="surfCount" class="count"></span></h3>
        <div id="surfList"></div>
      </section>
      <section class="media">
        <h3>Media
          <label class="btn small">+ Upload<input type="file" id="fileIn" multiple accept="image/*,video/*" hidden></label>
        </h3>
        <div id="mediaGrid" class="media-grid"></div>
      </section>
    </aside>

    <main id="stageWrap">
      <div id="stage">
        <canvas id="gl"></canvas>
        <canvas id="ov"></canvas>
      </div>
      <div id="toast"></div>
      <div id="dropHint">Drop images or videos to add them</div>
    </main>

    <aside id="right" class="panel">
      <nav class="tabs">
        <button data-tab="shape" class="active">Shape</button>
        <button data-tab="content">Content</button>
        <button data-tab="fx">Effects</button>
      </nav>
      <div id="inspector"></div>
    </aside>

    <footer id="foot">
      <div class="group scenes">
        <span class="lbl">Scenes</span>
        <div id="sceneList"></div>
        <button class="btn small" data-act="scene-add" title="Save the current look as a scene">+ Save</button>
      </div>
      <div class="group">
        <span class="lbl ab">A</span>
        <input type="range" class="xfade" min="0" max="1" step="0.001" data-bind="S.xfade" title="A/B crossfader">
        <span class="lbl ab">B</span>
      </div>
      <div class="group">
        <span class="lbl">Master</span>
        <input type="range" class="master" min="0" max="1" step="0.01" data-bind="S.master" title="Master brightness">
      </div>
      <div class="group">
        <span class="lbl">BPM</span>
        <input type="number" class="bpm" min="20" max="300" step="1" data-bind="S.bpm">
        <button class="btn small" data-act="tap" title="Tap tempo (Space)">Tap</button>
        <i id="beatLed" class="led"></i>
      </div>
      <div class="group">
        <button class="btn small" id="audioBtn" data-act="audio" title="Use the microphone so visuals react to music">Audio</button>
        <div id="meter" class="meter"><i></i></div>
      </div>
      <div class="group">
        <button class="btn small" id="recBtn" data-act="record" title="Record the output to a video file">● Rec</button>
        <button class="btn small danger" id="boBtn" data-act="blackout" title="Blackout (B)">Blackout</button>
      </div>
    </footer>
  </div>

  <div id="hint" class="output-hint"></div>
  <div id="modal" hidden>
    <div class="modal-card">
      <button class="close icon-btn" data-act="close-modal" title="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <input type="file" id="importIn" accept=".json,application/json" hidden>

  <script src="js/core.js"></script>
  <script src="js/render.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
